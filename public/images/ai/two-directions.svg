<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 336" width="1100" height="336" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .ink   { fill: #1e293b; }
    .muted { fill: #64748b; }
    .ind   { fill: #4338ca; }
    .grn   { fill: #047857; }
    .s-neu { stroke: #94a3b8; }  .f-neu { fill: rgba(100,116,139,0.10); }
    .s-ind { stroke: #6366f1; }  .f-ind { fill: rgba(99,102,241,0.14); }
    .f-ind-l { fill: rgba(99,102,241,0.05); }
    .s-grn { stroke: #10b981; }  .f-grn { fill: rgba(16,185,129,0.14); }
    .f-grn-l { fill: rgba(16,185,129,0.05); }
    .ln-i  { stroke: #6366f1; }  .ln-g { stroke: #10b981; }
    .div   { stroke: #cbd5e1; }
    .ah-i  { fill: #6366f1; }    .ah-g { fill: #10b981; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e2e8f0; }
      .muted { fill: #94a3b8; }
      .ind   { fill: #a5b4fc; }
      .grn   { fill: #6ee7b7; }
      .s-neu { stroke: #94a3b8; } .f-neu { fill: rgba(148,163,184,0.12); }
      .s-ind { stroke: #818cf8; } .f-ind { fill: rgba(99,102,241,0.22); }
      .f-ind-l { fill: rgba(99,102,241,0.08); }
      .s-grn { stroke: #34d399; } .f-grn { fill: rgba(16,185,129,0.18); }
      .f-grn-l { fill: rgba(16,185,129,0.08); }
      .ln-i  { stroke: #a5b4fc; } .ln-g { stroke: #6ee7b7; }
      .div   { stroke: #475569; }
      .ah-i  { fill: #a5b4fc; }   .ah-g { fill: #6ee7b7; }
    }
  </style>
  <defs>
    <marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="ah-i"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="ah-g"/>
    </marker>
  </defs>

  <!-- ===================== LEFT ===================== -->
  <text x="24" y="30" class="ind" font-size="16" font-weight="700" letter-spacing="0.09em">YOU CALL THE MODEL</text>
  <text x="24" y="52" class="muted" font-size="14">your app wants a summary, a rewrite, a description</text>

  <rect x="180" y="72" width="150" height="50" rx="11" class="f-neu s-neu" stroke-width="1.5"/>
  <text x="255" y="103" class="ink" font-size="15.5" font-weight="600" text-anchor="middle">Your app</text>

  <path d="M255 122 L255 138 L129 138 L129 154" fill="none" class="ln-i" stroke-width="1.8" marker-end="url(#aI)"/>
  <path d="M255 122 L255 138 L381 138 L381 154" fill="none" class="ln-i" stroke-width="1.8" marker-end="url(#aI)"/>

  <rect x="24" y="158" width="210" height="64" rx="11" class="f-ind s-ind" stroke-width="1.5"/>
  <text x="129" y="183" class="ink" font-size="15" font-weight="600" text-anchor="middle">ML Kit GenAI</text>
  <text x="129" y="204" class="muted" font-size="12.5" text-anchor="middle">summarize · rewrite · prompt</text>

  <rect x="276" y="158" width="210" height="64" rx="11" class="f-ind-l s-ind" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="381" y="183" class="ink" font-size="15" font-weight="600" text-anchor="middle">LiteRT-LM</text>
  <text x="381" y="204" class="muted" font-size="12.5" text-anchor="middle">a model you chose</text>

  <line x1="129" y1="222" x2="129" y2="250" class="ln-i" stroke-width="1.8" marker-end="url(#aI)"/>
  <line x1="381" y1="222" x2="381" y2="250" class="ln-i" stroke-width="1.8" marker-end="url(#aI)"/>

  <rect x="24" y="254" width="210" height="62" rx="11" class="f-neu s-neu" stroke-width="1.5"/>
  <text x="129" y="278" class="ink" font-size="14.5" font-weight="600" text-anchor="middle">AICore · Gemini Nano</text>
  <text x="129" y="298" class="muted" font-size="12" text-anchor="middle">an OS service, not in your APK</text>

  <rect x="276" y="254" width="210" height="62" rx="11" class="f-neu s-neu" stroke-width="1.5"/>
  <text x="381" y="278" class="ink" font-size="14.5" font-weight="600" text-anchor="middle">your .litertlm file</text>
  <text x="381" y="298" class="muted" font-size="12" text-anchor="middle">you ship it — gigabytes</text>

  <line x1="525" y1="18" x2="525" y2="322" class="div" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- ===================== RIGHT ===================== -->
  <text x="572" y="30" class="grn" font-size="16" font-weight="700" letter-spacing="0.09em">THE MODEL CALLS YOU</text>
  <text x="572" y="52" class="muted" font-size="14">“add oat milk to my shopping list”</text>

  <rect x="720" y="72" width="200" height="50" rx="11" class="f-grn s-grn" stroke-width="1.5"/>
  <text x="820" y="103" class="ink" font-size="15.5" font-weight="600" text-anchor="middle">Gemini / an agent</text>

  <line x1="820" y1="122" x2="820" y2="154" class="ln-g" stroke-width="1.8" marker-end="url(#aG)"/>

  <rect x="720" y="158" width="200" height="64" rx="11" class="f-grn-l s-grn" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="820" y="183" class="ink" font-size="15" font-weight="600" text-anchor="middle">AppFunctions</text>
  <text x="820" y="204" class="muted" font-size="12.5" text-anchor="middle">your app as an MCP server</text>

  <line x1="820" y1="222" x2="820" y2="250" class="ln-g" stroke-width="1.8" marker-end="url(#aG)"/>

  <rect x="720" y="254" width="200" height="62" rx="11" class="f-neu s-neu" stroke-width="1.5"/>
  <text x="820" y="278" class="ink" font-size="14.5" font-weight="600" text-anchor="middle">Your app</text>
  <text x="820" y="298" class="muted" font-size="12.5" text-anchor="middle">createTask(…) runs for real</text>
</svg>
